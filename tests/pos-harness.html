window.__req = [];
window.fetch = async (url, opts = {}) => {
  const u = String(url); window.__req.push({ url: u, opts });
  const J = (o, s = 200) => new Response(JSON.stringify(o), { status: s, headers: { 'Content-Type': 'application/json' } });
  if (u.includes('/shift/current')) return J({ shift: { id: 42, register_id: 1, opened_at: '2026-08-26 09:00:00' } });
  if (u.includes('/catalog'))       return J({ cursor: 7, changed: CATALOG, removed: [] });
  if (u.includes('/customers/lookup')) return J([{ phone_norm:'8801711223344', customer_id:44, display_name:'Karim Uddin', last_order_at:'2026-08-19 18:22:00' }]);
  if (u.match(/\/customers\/\d+\/profile/)) return J(CUSTOMER);
  if (u.includes('/sale')) return J({ order_id: 9001, receipt_no: 'R1-000042-0007', html: '<p>receipt</p>' });
  if (u.includes('/quick-add')) return J({ product_id: 9101 });
  return J({});
};
